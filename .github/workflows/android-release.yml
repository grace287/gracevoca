name: Android Release

on:
  push:
    tags:
      - 'prd-*'

# softprops/action-gh-release requires write permission to create releases
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        # NOTE: Currently uses debug signing key (no keystore configured).
        # For Play Store distribution, add the following steps before this one:
        #   1. Decode keystore: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks
        #   2. Set signing env vars: KEYSTORE_PATH, KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD
        #   3. Update android/app/build.gradle.kts signingConfigs.release block accordingly
        run: flutter build apk --release

      - name: Create GitHub Release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: GraceVoca ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
